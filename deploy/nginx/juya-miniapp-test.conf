# 替换 juya-test-domains.conf 内现有的 test-h5 HTTPS server 块
# 不与旧占位 server 同时加载；HTTP 跳转与 TLS 片段沿用现有配置
server {
    listen 443 ssl;
    server_name test-h5.juyayingyu.com;
    include /etc/nginx/snippets/juya-test-tls.conf;
    root /opt/juya/juya-miniapp-h5;
    index index.html;
    client_max_body_size 20m;
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/ready { proxy_pass http://127.0.0.1:8001; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
